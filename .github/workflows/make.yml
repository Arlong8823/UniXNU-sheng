name: package
# scripts/package.sh of this repository on a macOS runner, with the UniXNU and uefi-sheng
# checkouts beside it, the layout board.toml names. The platform seed comes from the
# repository secret UNIXNU_UNIQUE_CHIP_ID and is baked into the images, so the run's
# artifacts belong to one device alone: download them, then delete the run.
#
# ---------------------------------------------------------------------------
# 本文件相对上游 make.yml 的改动（可直接覆盖到 fork 的 .github/workflows/make.yml）：
#   1. inputs.os 增加 "macos-27"（macOS 27.3 / build 26C5035r），默认值改为 macos-27
#   2. Data seed 的 cache restore / save / 备份路径改为通配 out/sheng/*/*/runtime/，
#      同时覆盖 ipados-27.0.1-24A446 与 macos-27.3-26C5035r 两个 profile
#   3. 新增 "macOS data seed" 步骤与 macos_seed_cmd 输入：macOS 的 seed 必须以 root
#      生成，首跑会停在 package 步并打印 sudo 命令，把那行粘进 macos_seed_cmd 再跑即可
#   4. artifacts 保留期 1 天 -> 3 天（仍要跑完立刻下载）
#   5. UniXNU 的 ref 保留原 pin；若 --os macos-27 报 unknown OS profile，换成
#      be0e4fab0072bceaa8d744a4a6875ba5461cd7ff（含 GPU/Metal/display 集成）或更新的 commit
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["macos-27", "27", "26", "17"]
        default: "macos-27"
      init_data:
        description: "Create a NEW installation seed if no saved seed exists (iPadOS 27 only)"
        type: boolean
        default: false
      data_seed_url:
        description: "Optional original data.dbr URL for an existing installation; otherwise use the saved cache"
        type: string
      data_seed_sha256:
        description: "Required SHA-256 when data_seed_url is supplied"
        type: string
      macos_seed_cmd:
        description: "macOS 27 only: paste the sudo command printed by the failed seed build to reuse it on later runs"
        type: string
        default: ""
      build_userdata:
        description: "Also build the system image (userdata-root.img). Adds a long step; output is gzipped and split at 8 GiB"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 82b847c4ac3f68a57024b3082ffa3a03442defd9 # Wi-Fi runtime and Data firmware integration
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          path: uefi-sheng
          submodules: recursive
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          # Fail fast, naming the tool, before forty minutes of build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: seed cache identity
        id: seed-key
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=data-seed-v1-' + hashlib.sha256(os.environ['SEED'].encode()).hexdigest()[:16] + '\n')
          PY
      - uses: actions/cache/restore@v4
        id: data-cache
        if: inputs.os != '17'
        with:
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: prepare preserved Data seed
        if: inputs.os == '27'
        env:
          INIT_DATA: ${{ inputs.init_data }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          inputs = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          path = pathlib.Path('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr')
          url, digest = inputs.get('data_seed_url', ''), inputs.get('data_seed_sha256', '').lower()
          if url:
              print('::add-mask::' + url)
              if not url.startswith('https://') or len(digest) != 64 or any(c not in '0123456789abcdef' for c in digest):
                  raise SystemExit('A seed URL requires HTTPS and its SHA-256')
              with urllib.request.urlopen(url, timeout=120) as source:
                  data = source.read(64 * 1024 * 1024 + 1)
              if len(data) > 64 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit('Seed size or SHA-256 mismatch')
              if path.exists() and path.read_bytes() != data:
                  raise SystemExit('Saved seed differs; preserve and inspect it instead of replacing this installation')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          if not path.is_file() and os.environ['INIT_DATA'] != 'true':
              raise SystemExit('No saved seed. Supply the ORIGINAL seed for an existing installation, or select init_data for a FIRST installation')
          PY
      - name: macOS data seed
        # macOS 27.3 的 Data seed 必须以 root 从系统卷 /System/Library/Templates/Data 生成。
        # 首跑留空 macos_seed_cmd：package.sh 会在 seed 步停下并打印完整 sudo 命令，
        # 把那行原样粘进 macos_seed_cmd 再跑一次；生成成功后会被 cache 存住，后续直接复用。
        if: inputs.os == 'macos-27'
        env:
          SEED_CMD: ${{ inputs.macos_seed_cmd }}
        run: |
          if ls UniXNU/out/sheng/*/*/runtime/data.dbr >/dev/null 2>&1; then
            echo "seed restored from cache"
            ls -l UniXNU/out/sheng/*/*/runtime/data.dbr
            exit 0
          fi
          if [ -n "$SEED_CMD" ]; then
            echo "running the supplied seed command"
            ( cd UniXNU && bash -c "$SEED_CMD" )
            ls -l out/sheng/*/*/runtime/data.dbr
          else
            echo "no saved seed and macos_seed_cmd is empty: the package step will stop and print the exact sudo command"
          fi
      - name: fix fileset stub list
        # UniXNU 82b847c4 stubs only _native_* and _boot_log_rounds from its release link log;
        # sheng-cache-input-diagnostic.patch also declares a weak_import boot_cache_input_capture,
        # whose authenticated pointer fails the link on arm64e. Upstream added it on 2026-11-10.
        run: |
          python3 - <<'PYSTUB'
          import pathlib
          p = pathlib.Path('UniXNU/scripts/build-fileset-release-reference.py')
          s = p.read_text()
          old = '|boot_log_rounds))"'
          new = '|boot_log_rounds|boot_cache_input_capture))"'
          if old in s:
              p.write_text(s.replace(old, new, 1))
              print('patched fileset stub pattern')
          elif new in s:
              print('already patched')
          else:
              raise SystemExit('stub pattern not found')
          PYSTUB
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          INIT_DATA: ${{ inputs.init_data }}
          OS_PROFILE: ${{ inputs.os }}
        run: |
          args=(--os "$OS_PROFILE" --uefi ../uefi-sheng)
          if [ "$OS_PROFILE" = 27 ] && [ "$INIT_DATA" = true ]; then
            args+=(--init-data)
          fi
          scripts/package.sh "${args[@]}"
      - name: build userdata (system image)
        # package.sh 的固定步骤不含 userdata；系统分区镜像必须单独点名才构建。
        # 产物很大，先 gzip -1 再按 8 GiB 切片，避免单 artifact 上限和上传超时；
        # 还原：cat userdata-root.img.gz.part* | gunzip > userdata-root.img
        if: inputs.build_userdata
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          OS_PROFILE: ${{ inputs.os }}
        run: |
          cd UniXNU
          ./unixnu build userdata --os "$OS_PROFILE" -D ../device --dry-run
          ./unixnu build userdata --os "$OS_PROFILE" -D ../device
          img=$(ls out/sheng/*/*/userdata/userdata-root.img)
          ls -l "$img"
          cat "$(dirname "$img")/userdata-root.json"
          gzip -1 -f "$img"
          cd "$(dirname "$img")" && split -b 8G -d -a 3 userdata-root.img.gz userdata-root.img.gz.part
          ls -l userdata-root.img.gz.part*
      - uses: actions/cache/save@v4
        if: always() && inputs.os != '17' && steps.data-cache.outputs.cache-hit != 'true' && hashFiles('UniXNU/out/sheng/*/*/runtime/data.dbr') != ''
        with:
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: installation seed backup
        if: always() && inputs.os != '17' && hashFiles('UniXNU/out/sheng/*/*/runtime/data.dbr') != ''
        uses: actions/upload-artifact@v4
        with:
          name: installation-seed-${{ inputs.os }}
          retention-days: 3
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 3
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/boot/boot.img
            UniXNU/out/sheng/*/*/payload/payload.img
            UniXNU/out/sheng/*/*/kernel/kernel.macho
            UniXNU/out/sheng/*/*/package.manifest.json
            UniXNU/out/sheng/*/*/userdata/userdata-root.json
            UniXNU/out/sheng/*/*/userdata/userdata-root.img.gz.part*
