name: make

# scripts/package.sh of this repository on a macOS runner, with the UniXNU and uefi-sheng
# checkouts beside it, the layout board.toml names. The platform seed comes from the
# repository secret UNIXNU_UNIQUE_CHIP_ID and is baked into the images, so the run's
# artifacts belong to one device alone: download them, then delete the run.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["27", "26", "17"]
        default: "27"
      init_data:
        description: "Create a NEW installation seed if no saved seed exists (iPadOS 27 only)"
        type: boolean
        default: false
      data_seed_url:
        description: "Optional original data.dbr URL for an existing installation; otherwise use the saved cache"
        type: string
      data_seed_sha256:
        description: "Required SHA-256 when data_seed_url is supplied"
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 82b847c4ac3f68a57024b3082ffa3a03442defd9 # Wi-Fi runtime and Data firmware integration (the pin the device repository declares)
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          path: uefi-sheng
          submodules: recursive
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          # Fail fast, naming the tool, before forty minutes of build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8,16}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 to 16 hex digits.' >&2
            exit 1
          fi
      - name: seed cache identity
        id: seed-key
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=data-seed-v1-' + hashlib.sha256(os.environ['SEED'].encode()).hexdigest()[:16] + '\n')
          PY

      # ========== WiFi 用户态源码预取（缺了这一步 prepare-supplicant.py 必 exit 1） ==========
      - name: wifi deps cache
        id: wifi-deps
        uses: actions/cache/restore@v4
        with:
          path: device/drivers/Ath12kWifi/deps
          key: ath12k-deps-v2-${{ runner.os }}-${{ hashFiles('device/drivers/Ath12kWifi/**/source-lock.json') }}
          restore-keys: |
            ath12k-deps-v2-${{ runner.os }}-

      - name: wifi deps fetch
        if: steps.wifi-deps.outputs.cache-hit != 'true'
        working-directory: device
        run: |
          set -euo pipefail
          f=drivers/Ath12kWifi/tools/fetch-sources.py
          [ -f "$f" ] || f=$(find . -type f -name fetch-sources.py -not -path '*/deps/*' | head -1)
          [ -n "$f" ] || { echo "fetch-sources.py not found"; exit 1; }
          # cone 模式不接受 "/" 开头路径，换成非 cone（路径数组保持原样）
          python3 - "$f" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1]); s = p.read_text()
          s2 = s.replace('"sparse-checkout", "add"', '"sparse-checkout", "set", "--no-cone"')
          if s2 == s:
              print("sparse-checkout pattern not found (already patched?); continuing")
          else:
              p.write_text(s2); print("patched sparse-checkout -> set --no-cone")
          PY
          echo "=== running $f (real fetch, no --check) ==="
          python3 "$f"
          echo "=== deps after fetch ==="
          ls -la drivers/Ath12kWifi/deps

      - name: wifi deps verify
        working-directory: device
        run: |
          set -euo pipefail
          f=drivers/Ath12kWifi/tools/fetch-sources.py
          [ -f "$f" ] || f=$(find . -type f -name fetch-sources.py -not -path '*/deps/*' | head -1)
          python3 "$f" --check

      - name: wifi deps save
        if: always() && steps.wifi-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: device/drivers/Ath12kWifi/deps
          key: ath12k-deps-v2-${{ runner.os }}-${{ hashFiles('device/drivers/Ath12kWifi/**/source-lock.json') }}

      - name: wifi deps diagnose (on failure)
        if: failure()
        working-directory: device
        run: |
          echo "=== deps tree ==="
          ls -la drivers/Ath12kWifi/deps 2>/dev/null || echo "no deps dir"
          echo "=== tarballs ==="
          find . -path '*/deps/*' -name '*.tar.gz' -exec shasum -a 256 {} \; 2>/dev/null || true

      - name: wifi probe
        working-directory: device
        run: |
          set -x
          echo "--- fetch-sources --check ---"
          python3 drivers/Ath12kWifi/tools/fetch-sources.py --check || echo "CHECK_RC=$?"
          echo "--- deps listing ---"
          ls -l drivers/Ath12kWifi/deps || true
          echo "--- prepare-supplicant ---"
          python3 drivers/Ath12kWifi/tools/prepare-supplicant.py || echo "PREPARE_RC=$?"
      # ==========================================================================

      - uses: actions/cache/restore@v4
        id: data-cache
        if: inputs.os == '27'
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: prepare preserved Data seed
        if: inputs.os == '27'
        env:
          INIT_DATA: ${{ inputs.init_data }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          inputs = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          path = pathlib.Path('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr')
          url, digest = inputs.get('data_seed_url', ''), inputs.get('data_seed_sha256', '').lower()
          if url:
              print('::add-mask::' + url)
              if not url.startswith('https://') or len(digest) != 64 or any(c not in '0123456789abcdef' for c in digest):
                  raise SystemExit('A seed URL requires HTTPS and its SHA-256')
              with urllib.request.urlopen(url, timeout=120) as source:
                  data = source.read(64 * 1024 * 1024 + 1)
              if len(data) > 64 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit('Seed size or SHA-256 mismatch')
              if path.exists() and path.read_bytes() != data:
                  raise SystemExit('Saved seed differs; preserve and inspect it instead of replacing this installation')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          if not path.is_file() and os.environ['INIT_DATA'] != 'true':
              raise SystemExit('No saved seed. Supply the ORIGINAL seed for an existing installation, or select init_data for a FIRST installation')
          PY
      - name: fix mesa patch headers
        # Upstream 82b847c4 ships turnip-frame-diagnostics.patch without the
        # "new file mode 100644" line, so git apply dies with
        # "error: dev/null: No such file or directory". Insert the missing
        # metadata only: hunks, file list and the pinned mesa commit stay as-is.
        run: |
          python3 - <<'PYFIX'
          import json, pathlib, re
          HDR = re.compile(r'^(diff --git |new file mode |old mode |deleted file mode |index |similarity index |rename from |rename to )')
          pins = json.loads(pathlib.Path('UniXNU/scripts/data/adreno-compiler-inputs.json').read_text())
          total = 0
          for rel in pins['patches']:
              p = pathlib.Path('UniXNU') / rel
              if not p.is_file():
                  continue
              lines = p.read_text().splitlines(keepends=True)
              out, n = [], 0
              for i, ln in enumerate(lines):
                  if ln.startswith('--- /dev/null'):
                      j, declared = i - 1, False
                      while j >= 0 and HDR.match(lines[j]):
                          if lines[j].startswith('new file mode'):
                              declared = True
                          j -= 1
                      if not declared:
                          out.append('new file mode 100644\n')
                          n += 1
                  out.append(ln)
              if n:
                  p.write_text(''.join(out))
                  total += n
                  print(rel + ': inserted new file mode x' + str(n))
          print('total insertions: ' + str(total))
          PYFIX

      - name: fix fileset stub list
        # build-fileset-release-reference.py only stubs _native_* and _boot_log_rounds from its
        # link log; sheng-cache-input-diagnostic.patch also declares a weak_import
        # boot_cache_input_capture, whose authenticated pointer fails the RELEASE link on arm64e.
        # Upstream added it to the pattern on 2026-11-10 (00f47f6); this ref predates that.
        run: |
          python3 - <<'PYSTUB'
          import pathlib
          p = pathlib.Path('UniXNU/scripts/build-fileset-release-reference.py')
          s = p.read_text()
          old = '|boot_log_rounds))"'
          new = '|boot_log_rounds|boot_cache_input_capture))"'
          if old in s:
              p.write_text(s.replace(old, new, 1))
              print('patched fileset stub pattern')
          elif new in s:
              print('fileset stub pattern already covers boot_cache_input_capture')
          else:
              print('pattern not found; lines mentioning stub_names:')
              for i, line in enumerate(s.splitlines(), 1):
                  if 'stub_names' in line:
                      print(i, line)
              raise SystemExit(1)
          PYSTUB

      - name: proprietary files
        # Touch / Keyboard (nanosic MCU_Upgrade.bin) / Video (vpu30_4v.mbn) come from the
        # @fetch mirror of proprietary-files.txt; they are not committed anywhere.
        working-directory: device
        run: |
          python3 scripts/extract-files.py
          python3 scripts/extract-files.py --check
          ls -l .cache/firmware/nanosic .cache/firmware/novatek .cache/firmware/qcom/sm8550/sheng

      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          INIT_DATA: ${{ inputs.init_data }}
          OS_PROFILE: ${{ inputs.os }}
        run: |
          args=(--os "$OS_PROFILE" --uefi ../uefi-sheng)
          if [ "$OS_PROFILE" = 27 ] && [ "$INIT_DATA" = true ]; then
            args+=(--init-data)
          fi
          scripts/package.sh "${args[@]}"
      - uses: actions/cache/save@v4
        if: always() && inputs.os == '27' && steps.data-cache.outputs.cache-hit != 'true' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: installation seed backup
        if: always() && inputs.os == '27' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        uses: actions/upload-artifact@v4
        with:
          name: installation-seed-${{ inputs.os }}
          retention-days: 1
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
      - name: runtime log (on failure)
        if: failure()
        run: |
          for f in $(find UniXNU/out/sheng -maxdepth 8 \( -name 'runtime.log' -o -name 'lto-build.log' -o -name 'archive-*.log' \) 2>/dev/null | head -8); do
            echo "===== $f ====="
            tail -n 120 "$f"
          done
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/boot/boot.img
            UniXNU/out/sheng/*/*/payload/payload.img
            UniXNU/out/sheng/*/*/kernel/kernel.macho
            UniXNU/out/sheng/*/*/package.manifest.json
